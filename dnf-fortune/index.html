<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 던파운세 | 아라드 데일리 오라클</title>
  <meta name="description" content="모험단명만 넣으면 끝. 오늘의 명당 채널, 증폭·강화운, 행운의 NPC까지 오늘 하루 아라드의 기운을 감정해 드려요. (비공식 팬 콘텐츠)" />
  <meta property="og:title" content="오늘의 던파운세 · 태초 운세 확률 3%" />
  <meta property="og:description" content="오늘 어느 채널이 명당인지, 증폭 눌러도 되는 날인지 감정해 드려요. 회원가입 없이 이름만 넣으면 끝." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://cdn.df.nexon.com" crossorigin />
  <link rel="preconnect" href="https://resource.df.nexon.com" crossorigin />
</head>
<body>
<style>
  /* ── 던파 공식 웹폰트 (연단된 칼날 = 헤드라인, SUIT = 본문) ── */
  @font-face {
    font-family: 'DNFForgedBlade';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('https://cdn.df.nexon.com/img/common/font/DNFForgedBlade-Bold.otf') format('opentype');
  }
  @font-face { font-family: 'SUIT'; font-weight: 400; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 500; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 700; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 800; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-ExtraBold.woff2') format('woff2'); }

  :root {
    --bg: #070b14;
    --bg-2: #0b1120;
    --panel: #101a2e;
    --panel-deep: #0b1322;
    --line: #22304a;
    --line-soft: #1a2740;
    --ink: #eaf1ff;
    --muted: #8b97b3;
    --muted-2: #5f6c88;
    --gold: #e6bb5e;
    --gold-deep: #b98f37;
    --gold-soft: rgba(230,187,94,0.08);
    --cyan: #5fd6e6;
    --rare: #b07bff;
    --unique: #ff6fd6;
    --legendary: #ff9a3c;
    --epic: #ffcf47;
    --taecho: #7ff5d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1100px 480px at 50% -8%, rgba(230,187,94,0.10), transparent 62%),
      radial-gradient(900px 620px at 84% 112%, rgba(95,214,230,0.07), transparent 55%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color: var(--ink);
    font-family: 'SUIT', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 42px 20px 66px; }
  .display { font-family: 'DNFForgedBlade', 'SUIT', sans-serif; font-weight: 700; }

  /* ── 마스트헤드 ─────────────────────────── */
  .masthead { text-align: center; margin-bottom: 34px; }
  .eyebrow {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.26em;
    color: var(--gold);
    border: 1px solid var(--gold-deep);
    border-radius: 2px;
    padding: 5px 13px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    margin: 0 0 12px;
    font-size: clamp(38px, 10.5vw, 54px);
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.1;
    text-wrap: balance;
  }
  h1 .accent {
    background: linear-gradient(100deg, var(--gold) 18%, #f6e2ad 50%, var(--gold) 82%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .masthead p { margin: 0; color: var(--muted); font-size: 14.5px; }

  /* ── 입장 게이트 ────────────────────────── */
  .gate {
    background: linear-gradient(180deg, var(--panel), var(--panel-deep));
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 28px 24px 22px;
    box-shadow: 0 18px 50px -30px rgba(0,0,0,0.9);
  }
  .gate label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 11px;
    font-weight: 700;
  }
  .gate-row { display: flex; gap: 10px; }
  .gate input {
    flex: 1;
    min-width: 0;
    background: #060a12;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    padding: 13px 15px;
  }
  .gate input:focus { outline: 2px solid var(--gold-deep); outline-offset: 1px; border-color: var(--gold-deep); }
  .gate input::placeholder { color: #46506b; }
  .btn {
    font-family: 'SUIT', sans-serif;
    font-weight: 800;
    font-size: 15px;
    border-radius: 6px;
    padding: 13px 20px;
    cursor: pointer;
    border: 1px solid var(--gold-deep);
    background: linear-gradient(180deg, #efc873, #c1963c);
    color: #201703;
    white-space: nowrap;
    transition: filter 0.15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 2px solid var(--epic); outline-offset: 2px; }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    font-weight: 600;
  }
  .btn.ghost:hover { color: var(--ink); border-color: var(--gold-deep); filter: none; }
  .gate .hint { margin: 15px 0 0; font-size: 12.5px; color: var(--muted); }

  /* ── 항아리 개봉 연출 무대 ───────────────── */
  .stage {
    position: relative;
    height: 300px;
    margin-top: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage-caption {
    position: absolute;
    top: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    color: var(--gold);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .stage.on .stage-caption { opacity: 1; }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .flash {
    position: absolute;
    left: 50%; top: 50%;
    width: 30px; height: 30px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, #fff 0%, #ffe9b0 22%, rgba(230,187,94,0.55) 45%, rgba(95,214,230,0.15) 65%, transparent 78%);
    pointer-events: none;
  }
  .jar-wrap {
    position: relative;
    width: 190px; height: 210px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .jar-glow {
    position: absolute;
    left: 50%; bottom: 34px;
    width: 150px; height: 150px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(230,187,94,0.45), rgba(95,214,230,0.12) 55%, transparent 72%);
    filter: blur(4px);
  }
  .jar-svg { position: relative; width: 178px; height: auto; }
  .jar-lid { transform-origin: 50% 100%; }

  @media (prefers-reduced-motion: no-preference) {
    .stage.charging .jar-svg { animation: jarShake 0.62s ease-in-out; }
    .stage.charging .jar-glow { animation: glowPulse 0.62s ease-in-out; }
    .stage.pop .jar-wrap { animation: jarFade 0.5s ease-out 0.12s forwards; }
    .stage.pop .jar-lid { animation: lidPop 0.5s cubic-bezier(0.3,0.7,0.3,1) forwards; }
    .stage.pop .flash { animation: flashBurst 0.62s ease-out forwards; }
    @keyframes jarShake {
      0%,100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-4px) rotate(-2deg); }
      45% { transform: translateX(5px) rotate(2deg); }
      70% { transform: translateX(-3px) rotate(-1.4deg); }
    }
    @keyframes glowPulse { 0%,100% { opacity: 0.65; transform: translateX(-50%) scale(0.9); } 55% { opacity: 1; transform: translateX(-50%) scale(1.18); } }
    @keyframes lidPop {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(-88px) rotate(-24deg); opacity: 0; }
    }
    @keyframes flashBurst {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
      30% { opacity: 1; }
      60% { transform: translate(-50%,-50%) scale(7.5); opacity: 0.85; }
      100% { transform: translate(-50%,-50%) scale(11); opacity: 0; }
    }
    @keyframes jarFade { to { opacity: 0; transform: scale(0.94); } }
  }

  /* ── 결과: 아이템 툴팁 카드 ─────────────── */
  .card {
    position: relative;
    background: linear-gradient(180deg, #101a2d, #0a1220) padding-box;
    border: 2px solid var(--tier, var(--gold));
    border-radius: 8px;
    padding: 26px 24px 22px;
    box-shadow: 0 0 36px -8px color-mix(in srgb, var(--tier, var(--gold)) 55%, transparent);
  }
  .card.taecho {
    border-color: transparent;
    background:
      linear-gradient(180deg, #101a2d, #0a1220) padding-box,
      linear-gradient(120deg, #7ff5d4, #9db7ff, #f6c6ff, #7ff5d4) border-box;
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 15px; height: 15px;
    border-color: var(--tier, var(--gold));
    border-style: solid;
    opacity: 0.9;
  }
  .card::before { top: 7px; left: 7px; border-width: 2px 0 0 2px; }
  .card::after { bottom: 7px; right: 7px; border-width: 0 2px 2px 0; }

  @media (prefers-reduced-motion: no-preference) {
    .reveal .card { animation: dropIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.2) backwards; }
    .card.taecho { animation: taechoPulse 2.6s ease-in-out infinite; }
    .reveal .card.taecho { animation: dropIn 0.5s cubic-bezier(0.2,0.9,0.3,1.2) backwards, taechoPulse 2.6s ease-in-out 0.6s infinite; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-14px) scale(0.98); } to { opacity: 1; transform: none; } }
    @keyframes taechoPulse {
      0%, 100% { box-shadow: 0 0 30px -6px rgba(127,245,212,0.55); }
      50% { box-shadow: 0 0 46px -2px rgba(157,183,255,0.65); }
    }
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .tier-name {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: clamp(25px, 6.6vw, 31px);
    font-weight: 700;
    letter-spacing: 0.005em;
    color: var(--tier, var(--gold));
    margin: 0 0 6px;
    line-height: 1.22;
    text-wrap: balance;
  }
  .card.taecho .tier-name {
    background: linear-gradient(100deg, #7ff5d4, #b9d4ff, #f0c9ff, #7ff5d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tier-line { margin: 0 0 18px; font-size: 14.5px; color: var(--ink); }

  .divider { border: 0; border-top: 1px dashed var(--line); margin: 18px 0; }

  .sec-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--gold);
    margin: 0 0 8px;
    font-weight: 700;
  }
  .channel-big {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: 33px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--ink);
    line-height: 1.2;
  }
  .channel-big .region { color: var(--cyan); }
  .channel-big small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 3px; font-family: 'SUIT', sans-serif; }
  .flavor { margin: 7px 0 0; font-size: 14px; color: var(--muted); }
  .flavor strong { color: var(--ink); font-weight: 600; }

  .stat-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin: 12px 0 2px;
  }
  .stat-row .name { font-size: 15px; font-weight: 700; }
  .stars { font-size: 17px; letter-spacing: 3px; white-space: nowrap; }
  .stars .on { color: var(--epic); text-shadow: 0 0 8px rgba(255,207,71,0.45); }
  .stars .off { color: #384258; }
  .stat-comment { margin: 3px 0 10px; font-size: 13.5px; color: var(--muted); }

  .pct {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
  }
  .pct small { font-size: 15px; color: var(--muted); font-weight: 700; font-family: 'SUIT', sans-serif; }
  .pct-sub { font-size: 12.5px; color: var(--muted-2); margin: 2px 0 6px; }

  .mini { margin: 4px 0 0; }
  .mini .m { padding: 11px 0; border-top: 1px solid var(--line-soft); }
  .mini .m:first-child { border-top: 0; }
  .mini .m-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .mini .m-label { font-size: 12px; letter-spacing: 0.1em; color: var(--gold); font-weight: 700; white-space: nowrap; }
  .mini .m-value { font-size: 16px; font-weight: 700; color: var(--ink); text-align: right; }
  .mini .m-note { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  .quote {
    margin: 0;
    padding: 14px 16px;
    background: var(--gold-soft);
    border-left: 3px solid var(--gold-deep);
    border-radius: 0 6px 6px 0;
    font-size: 14px;
    color: var(--ink);
  }
  .quote .who { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); text-align: right; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .actions .btn { flex: 1; min-width: 140px; }
  .share-nudge { text-align: center; font-size: 12.5px; color: var(--muted); margin: 15px 0 0; }
  .share-nudge b { color: var(--taecho); font-weight: 700; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: #16203a;
    border: 1px solid var(--gold-deep);
    color: var(--ink);
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 6px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    margin-top: 44px;
    text-align: center;
    font-size: 12px;
    color: #58637f;
    line-height: 1.75;
  }
  footer p { margin: 4px 0; }
  [hidden] { display: none !important; }
</style>

<main>
  <header class="masthead">
    <span class="eyebrow">ARAD DAILY ORACLE</span>
    <h1>오늘의 <span class="accent">던파운세</span></h1>
    <p>모험단명을 넣으면 오늘 하루 아라드의 기운을 감정해 드려요.<br>같은 모험단은 자정까지 같은 결과, 자정(KST)이 지나면 새로 바뀝니다.</p>
  </header>

  <section class="gate" id="gate">
    <label for="advName">모험단명 (또는 캐릭터명)</label>
    <div class="gate-row">
      <input id="advName" type="text" maxlength="20" placeholder="예) 잠수함패치" autocomplete="off" />
      <button class="btn" id="drawBtn" type="button">운세 감정</button>
    </div>
    <p class="hint">회원가입 없어요. 입력한 이름은 어디에도 저장되지 않는 순수 재미용 비공식 팬 콘텐츠입니다.</p>
  </section>

  <section id="stageWrap" hidden>
    <div class="stage" id="stage">
      <div class="stage-caption" id="stageCap">항아리를 여는 중</div>
      <div class="jar-wrap" id="jarWrap">
        <div class="jar-glow"></div>
        <svg class="jar-svg" viewBox="0 0 200 220" aria-hidden="true">
          <defs>
            <linearGradient id="jarBody" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#22304a"/>
              <stop offset="0.5" stop-color="#151f36"/>
              <stop offset="1" stop-color="#0c1424"/>
            </linearGradient>
            <linearGradient id="jarGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4d488"/>
              <stop offset="1" stop-color="#b98f37"/>
            </linearGradient>
            <radialGradient id="jarCore" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#fff3cf"/>
              <stop offset="0.5" stop-color="#e6bb5e"/>
              <stop offset="1" stop-color="#5fd6e6" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- 본체 -->
          <path d="M46 108 Q34 210 100 212 Q166 210 154 108 Q150 96 100 96 Q50 96 46 108 Z" fill="url(#jarBody)" stroke="url(#jarGold)" stroke-width="3"/>
          <!-- 금테 밴드 -->
          <path d="M50 132 Q100 148 150 132" fill="none" stroke="url(#jarGold)" stroke-width="3" opacity="0.85"/>
          <path d="M56 170 Q100 184 144 170" fill="none" stroke="#b98f37" stroke-width="2" opacity="0.6"/>
          <!-- 안쪽 빛 -->
          <ellipse cx="100" cy="104" rx="42" ry="16" fill="url(#jarCore)"/>
          <circle cx="100" cy="104" r="9" fill="#fff3cf" opacity="0.9"/>
          <!-- 목/입구 -->
          <path d="M62 100 Q100 78 138 100" fill="none" stroke="url(#jarGold)" stroke-width="3"/>
          <!-- 뚜껑 -->
          <g class="jar-lid">
            <ellipse cx="100" cy="86" rx="46" ry="14" fill="#18233b" stroke="url(#jarGold)" stroke-width="3"/>
            <path d="M74 84 Q100 66 126 84" fill="#101a2d" stroke="url(#jarGold)" stroke-width="3"/>
            <circle cx="100" cy="70" r="6" fill="url(#jarGold)"/>
          </g>
        </svg>
      </div>
      <div class="flash" id="flash"></div>
      <canvas class="fx" id="fx"></canvas>
    </div>
  </section>

  <section id="resultWrap" hidden>
    <article class="card" id="card" aria-live="polite"></article>
    <div class="actions">
      <button class="btn" id="copyBtn" type="button">결과 복사하기</button>
      <button class="btn ghost" id="shareBtn" type="button">링크 공유</button>
      <button class="btn ghost" id="againBtn" type="button">다른 모험단 감정</button>
    </div>
    <p class="share-nudge" id="nudge"></p>
  </section>

  <footer>
    <p>본 페이지는 유저가 만든 비공식 팬 콘텐츠이며, 던전앤파이터 및 네오플·넥슨과 무관합니다.</p>
    <p>모든 결과는 실제 게임 확률과 관련 없는 랜덤 재미 요소예요. 증폭은 언제나 본인 책임.</p>
  </footer>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  /* ── 결정론적 시드: 모험단명 + KST 날짜 ── */
  function hash32(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function kstDateKey() {
    return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  }
  function kstDateLabel() {
    return new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric", weekday: "short" }).format(new Date());
  }

  /* ── 콘텐츠 풀 ── */

  /* ── 운세 생성 (rng 호출 순서 고정) ── */
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function starsFor(rng, tierIdx) {
    var raw = rng() * 4 + 0.5 + tierIdx * 0.4;
    return Math.min(5, Math.max(1, Math.round(raw)));
  }
  function rollTier(rng) {
    var r = rng(), acc = 0;
    for (var i = TIERS.length - 1; i >= 0; i--) {
      acc += TIERS[i].p;
      if (r < acc) return i;
    }
    return 0;
  }
  function makeFortune(name) {
    var rng = mulberry32(hash32(name.trim() + "|" + kstDateKey() + "|arad"));
    var tierIdx = rollTier(rng);
    var region = pick(rng, REGIONS);
    var channel = 1 + Math.floor(rng() * region[1]);
    var chFlavor = pick(rng, CH_FLAVOR);
    var time = pick(rng, TIMES);
    var amp = starsFor(rng, tierIdx);
    var reinf = starsFor(rng, tierIdx);
    var lock = starsFor(rng, tierIdx);
    var party = 17 + Math.floor(rng() * 83);
    var partyComment = "";
    for (var i = 0; i < PARTY_COMMENT.length; i++) {
      if (party < PARTY_COMMENT[i][0]) { partyComment = PARTY_COMMENT[i][1]; break; }
    }
    var npc = pick(rng, NPCS);
    var item = pick(rng, ITEMS);
    var action = pick(rng, ACTIONS);
    var quote = pick(rng, QUOTES);
    return {
      name: name.trim(),
      tier: TIERS[tierIdx],
      region: region[0],
      channel: channel,
      chFlavor: chFlavor,
      time: time,
      amp: amp, reinf: reinf, lock: lock,
      party: party, partyComment: partyComment,
      npc: npc, item: item, action: action, quote: quote
    };
  }

  /* ── 항아리 개봉 파티클 버스트 ── */
  function particleBurst() {
    try {
      var rect = stage.getBoundingClientRect();
      var w = fxCanvas.width = rect.width;
      var h = fxCanvas.height = rect.height;
      var ctx = fxCanvas.getContext("2d");
      var cx = w / 2, cy = h / 2 + 10;
      var colors = ["#f6e2ad", "#e6bb5e", "#fff3cf", "#5fd6e6", "#ffcf47"];
      var parts = [];
      for (var i = 0; i < 46; i++) {
        var ang = Math.PI * 2 * (i / 46) + (Math.random() - 0.5) * 0.5;
        var sp = 3.2 + Math.random() * 5.5;
        parts.push({
          x: cx, y: cy,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 2.4,
          r: 1.6 + Math.random() * 3.2,
          c: colors[(Math.random() * colors.length) | 0],
          life: 1
        });
      }
      var frames = 0;
      function step() {
        frames++;
        ctx.clearRect(0, 0, w, h);
        var alive = false;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (p.life <= 0) continue;
          alive = true;
          p.vy += 0.16;
          p.vx *= 0.985;
          p.x += p.vx; p.y += p.vy;
          p.life -= 0.018;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (alive && frames < 130) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, w, h);
      }
      requestAnimationFrame(step);
    } catch (e) { /* 파티클 실패해도 결과는 나온다 */ }
  }

      "✅ 오늘의 추천 행동 " + f.action[0],
      "━━━━━━━━━━━━━━",
      "나도 감정받기 → " + location.origin + location.pathname
    ];
    navigator.clipboard.writeText(lines.join("\n")).then(
      function () { showToast("운세를 복사했어요. 게시판에 붙여넣어 자랑해 보세요!"); },
      function () { showToast("복사에 실패했어요. 스크린샷을 이용해 주세요."); }
    );
  }

  function shareLink() {
    var url = location.origin + location.pathname + (current ? "?adv=" + encodeURIComponent(current.name) : "");
    if (navigator.share) {
      navigator.share({ title: "오늘의 던파운세", text: "오늘 아라드의 기운을 감정받아 보세요.", url: url }).catch(function () {});
    } else {
      navigator.clipboard.writeText(url).then(function () { showToast("링크를 복사했어요."); });
    }
  }

  function draw() {
    var name = input.value.trim();
    if (!name) { input.focus(); showToast("모험단명을 입력해 주세요."); return; }
    playAndReveal(makeFortune(name));
  }

  document.getElementById("drawBtn").addEventListener("click", draw);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") draw(); });
  document.getElementById("copyBtn").addEventListener("click", copyText);
  document.getElementById("shareBtn").addEventListener("click", shareLink);
  document.getElementById("againBtn").addEventListener("click", function () {
    wrap.hidden = true;
    stageWrap.hidden = true;
    gate.hidden = false;
    input.value = "";
    input.focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  var param = new URLSearchParams(location.search).get("adv");
  if (param && param.trim()) {
    input.value = param.trim();
    render(makeFortune(param.trim()));
    gate.hidden = true;
    wrap.hidden = false;
    wrap.classList.add("reveal");
  }
})();
</script>
</body>
</html>
