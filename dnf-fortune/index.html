<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 던파운세 | 아라드 데일리 오라클</title>
  <meta name="description" content="모험단명만 넣으면 끝. 오늘의 명당 채널, 증폭·강화운, 행운의 NPC까지 오늘 하루 아라드의 기운을 감정해 드려요. (비공식 팬 콘텐츠)" />
  <meta property="og:title" content="오늘의 던파운세 · 태초 운세 확률 3%" />
  <meta property="og:description" content="오늘 어느 채널이 명당인지, 증폭 눌러도 되는 날인지 감정해 드려요. 회원가입 없이 이름만 넣으면 끝." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://cdn.df.nexon.com" crossorigin />
  <link rel="preconnect" href="https://resource.df.nexon.com" crossorigin />
  <script>document.documentElement.className += " js";</script>
</head>
<body>
<style>
  /* ── 던파 공식 웹폰트 (연단된 칼날 = 헤드라인, SUIT = 본문) ── */
  @font-face {
    font-family: 'DNFForgedBlade';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('https://cdn.df.nexon.com/img/common/font/DNFForgedBlade-Bold.otf') format('opentype');
  }
  @font-face { font-family: 'SUIT'; font-weight: 400; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 500; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 700; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-Bold.woff2') format('woff2'); }
  @font-face { font-family: 'SUIT'; font-weight: 800; font-display: swap; src: url('https://resource.df.nexon.com/ui/css/font/SUIT-ExtraBold.woff2') format('woff2'); }

  :root {
    --bg: #08080d;
    --bg-2: #0c0d16;
    --panel: #14141f;
    --panel-deep: #0e0e17;
    --line: #29293a;
    --line-soft: #1e1e2b;
    --ink: #f1edff;
    --muted: #9a93ad;
    --muted-2: #6a6380;
    --gold: #e8bd63;
    --gold-bright: #f7e4ad;
    --gold-deep: #b98f37;
    --gold-soft: rgba(232,189,99,0.08);
    --azure: #3f9bff;
    --cyan: #5fd6e6;
    --rare: #b07bff;
    --unique: #ff6fd6;
    --legendary: #ff9a3c;
    --epic: #ffcf47;
    --taecho: #7ff5d4;
    --spring: cubic-bezier(0.22, 1, 0.36, 1);
    --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 520px at 50% -12%, rgba(232,189,99,0.11), transparent 60%),
      radial-gradient(1000px 700px at 82% 120%, rgba(63,155,255,0.09), transparent 58%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'SUIT', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    line-height: 1.65;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 30px 20px 66px; }
  .display { font-family: 'DNFForgedBlade', 'SUIT', sans-serif; font-weight: 700; }

  /* ── 반투명 상단 브랜드 바 (materialize) ─── */
  .brandbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(10,10,18,0.55);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    backdrop-filter: blur(14px) saturate(160%);
    border-bottom: 1px solid rgba(232,189,99,0.14);
  }
  .brandbar .in {
    max-width: 560px;
    margin: 0 auto;
    padding: 11px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brandbar .bt { font-family: 'DNFForgedBlade', 'SUIT', sans-serif; font-size: 15px; letter-spacing: 0.02em; color: var(--gold); }
  .brandbar .bd { font-size: 11px; letter-spacing: 0.18em; color: var(--muted-2); font-variant-numeric: tabular-nums; }

  /* ── 마스트헤드 ─────────────────────────── */
  .masthead { text-align: center; margin: 26px 0 34px; }
  .eyebrow {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.26em;
    color: var(--gold);
    border: 1px solid var(--gold-deep);
    border-radius: 2px;
    padding: 5px 13px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    margin: 0 0 12px;
    font-size: clamp(38px, 10.5vw, 54px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.08;
    text-wrap: balance;
  }
  h1 .accent {
    background: linear-gradient(100deg, var(--gold) 16%, var(--gold-bright) 50%, var(--gold) 84%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .masthead p { margin: 0; color: var(--muted); font-size: 14.5px; }

  /* ── 입장 게이트 ────────────────────────── */
  .gate {
    background: linear-gradient(180deg, var(--panel), var(--panel-deep));
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px 24px 22px;
    box-shadow: 0 22px 60px -34px rgba(0,0,0,0.95);
  }
  .gate label {
    display: block;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--gold);
    margin-bottom: 11px;
    font-weight: 700;
  }
  .gate-row { display: flex; gap: 10px; }
  .gate input {
    flex: 1;
    min-width: 0;
    background: #050509;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    padding: 13px 15px;
    transition: border-color 0.2s var(--spring), box-shadow 0.2s var(--spring);
  }
  .gate input:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(232,189,99,0.16); }
  .gate input::placeholder { color: #45455e; }
  .btn {
    font-family: 'SUIT', sans-serif;
    font-weight: 800;
    font-size: 15px;
    border-radius: 8px;
    padding: 13px 20px;
    cursor: pointer;
    border: 1px solid var(--gold-deep);
    background: linear-gradient(180deg, #efc873, #c1963c);
    color: #201703;
    white-space: nowrap;
    transition: transform 0.14s var(--spring), filter 0.14s ease, box-shadow 0.2s ease;
  }
  .btn:hover { filter: brightness(1.07); box-shadow: 0 8px 22px -10px rgba(232,189,99,0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--epic); outline-offset: 2px; }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    font-weight: 600;
    box-shadow: none;
  }
  .btn.ghost:hover { color: var(--ink); border-color: var(--gold-deep); filter: none; box-shadow: none; }
  .gate .hint { margin: 15px 0 0; font-size: 12.5px; color: var(--muted); }

  /* ── 항아리 개봉 연출 무대 ───────────────── */
  .stage {
    position: relative;
    height: 360px;
    margin-top: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage-amb {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(80% 70% at 50% 52%, rgba(40,95,180,0.30), rgba(10,26,58,0.14) 52%, transparent 76%);
    transition: opacity 0.6s ease;
  }
  .stage.on .stage-amb { opacity: 1; }
  .stage-caption {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12.5px;
    letter-spacing: 0.16em;
    color: var(--gold);
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 5;
  }
  .stage.on .stage-caption { opacity: 1; }
  .countdown {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: 64px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 24px rgba(232,189,99,0.65), 0 3px 6px rgba(0,0,0,0.5);
    opacity: 0;
    line-height: 1;
    z-index: 6;
    pointer-events: none;
  }
  .countdown.tick { animation: cdTick 0.82s ease-out; }
  @keyframes cdTick {
    0% { opacity: 0; transform: translateX(-50%) scale(1.7); }
    22% { opacity: 1; transform: translateX(-50%) scale(1); }
    78% { opacity: 1; transform: translateX(-50%) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) scale(0.82); }
  }
  .fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .flash {
    position: absolute;
    left: 50%; top: 50%;
    width: 30px; height: 30px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, #fff 0%, #ffe9b0 22%, rgba(232,189,99,0.55) 45%, rgba(63,155,255,0.16) 65%, transparent 78%);
    pointer-events: none;
  }
  .jar-wrap {
    position: relative;
    width: 190px; height: 210px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .jar-glow {
    position: absolute;
    left: 50%; bottom: 34px;
    width: 150px; height: 150px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,189,99,0.45), rgba(63,155,255,0.14) 55%, transparent 72%);
    filter: blur(4px);
  }
  .jar-svg { position: relative; width: 178px; height: auto; }
  .jar-lid { transform-origin: 50% 100%; }

  @media (prefers-reduced-motion: no-preference) {
    .stage.charging .jar-svg { animation: jarTremor 0.45s ease-in-out infinite; }
    .stage.charging .jar-glow { animation: glowBuild 2.5s ease-in forwards; }
    .stage.pop .jar-wrap { animation: jarFade 0.5s ease-out 0.12s forwards; }
    .stage.pop .jar-lid { animation: lidPop 0.5s var(--spring-bounce) forwards; }
    .stage.pop .flash { animation: flashBurst 0.62s ease-out forwards; }
    @keyframes jarShake {
      0%,100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-4px) rotate(-2deg); }
      45% { transform: translateX(5px) rotate(2deg); }
      70% { transform: translateX(-3px) rotate(-1.4deg); }
    }
    @keyframes jarTremor { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-1.5px) rotate(-0.6deg); } 75% { transform: translateX(1.5px) rotate(0.6deg); } }
    @keyframes glowBuild { 0% { opacity: 0.35; transform: translateX(-50%) scale(0.8); } 100% { opacity: 1; transform: translateX(-50%) scale(1.3); } }
    @keyframes lidPop {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(-88px) rotate(-24deg); opacity: 0; }
    }
    @keyframes flashBurst {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
      30% { opacity: 1; }
      60% { transform: translate(-50%,-50%) scale(7.5); opacity: 0.85; }
      100% { transform: translate(-50%,-50%) scale(11); opacity: 0; }
    }
    @keyframes jarFade { to { opacity: 0; transform: scale(0.94); } }
  }

  /* ── 결과: 아이템 툴팁 카드 ─────────────── */
  .card {
    position: relative;
    background: linear-gradient(180deg, #14141f, #0b0b14) padding-box;
    border: 2px solid var(--tier, var(--gold));
    border-radius: 10px;
    padding: 26px 24px 22px;
    box-shadow: 0 0 38px -8px color-mix(in srgb, var(--tier, var(--gold)) 52%, transparent), 0 28px 60px -34px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(232,189,99,0.20);
  }
  .card.taecho {
    border-color: transparent;
    background:
      linear-gradient(180deg, #14141f, #0b0b14) padding-box,
      linear-gradient(120deg, #7ff5d4, #9db7ff, #f6c6ff, #7ff5d4) border-box;
  }
  /* ── 보상 프레임 장식 (priestdoll 주간 보상 단계 테두리 느낌) ── */
  .cardframe { position: relative; }
  .card::before, .card::after {
    content: "";
    position: absolute;
    left: 6px; right: 6px;
    border-top: 1px solid rgba(232,189,99,0.30);
    pointer-events: none;
  }
  .card::before { top: 6px; }
  .card::after { bottom: 6px; }
  .corn {
    position: absolute;
    width: 13px; height: 13px;
    z-index: 3;
    transform: rotate(45deg);
    background: linear-gradient(135deg, #f7e4ad, #b98f37);
    box-shadow: 0 0 0 2px var(--panel-deep), 0 0 9px rgba(232,189,99,0.55);
    pointer-events: none;
  }
  .corn::after { content: ""; position: absolute; inset: 4px; background: var(--panel-deep); }
  .corn.tl { left: -6px; top: -6px; }
  .corn.tr { right: -6px; top: -6px; }
  .corn.bl { left: -6px; bottom: -6px; }
  .corn.br { right: -6px; bottom: -6px; }

  @media (prefers-reduced-motion: no-preference) {
    .reveal .cardframe { animation: matIn 0.55s var(--spring) backwards; }
    .card.taecho { animation: taechoPulse 2.6s ease-in-out infinite; }
    @keyframes matIn { from { opacity: 0; transform: translateY(-12px) scale(0.985); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes taechoPulse {
      0%, 100% { box-shadow: 0 0 30px -6px rgba(127,245,212,0.55); }
      50% { box-shadow: 0 0 46px -2px rgba(157,183,255,0.65); }
    }
    /* 카드 내부 섹션 순차 등장 */
    .reveal .card > .rvi { animation: rviUp 0.5s var(--spring) backwards; }
  }
  @keyframes rviUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .tier-name {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: clamp(25px, 6.6vw, 31px);
    font-weight: 700;
    letter-spacing: -0.005em;
    color: var(--tier, var(--gold));
    margin: 0 0 6px;
    line-height: 1.22;
    text-wrap: balance;
  }
  .card.taecho .tier-name {
    background: linear-gradient(100deg, #7ff5d4, #b9d4ff, #f0c9ff, #7ff5d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tier-line { margin: 0 0 18px; font-size: 14.5px; color: var(--ink); }

  /* 금장 장식 구분선 (중앙 마름모) */
  .divider {
    border: 0;
    height: 12px;
    margin: 18px 0;
    background:
      linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent) center/100% 1px no-repeat;
    position: relative;
  }
  .divider::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: var(--gold-deep);
    box-shadow: 0 0 0 3px var(--panel-deep);
  }

  .sec-label {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--gold);
    margin: 0 0 8px;
    font-weight: 700;
  }
  .channel-big {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: 33px;
    font-weight: 700;
    letter-spacing: 0.005em;
    color: var(--ink);
    line-height: 1.2;
  }
  .channel-big .region { color: var(--cyan); }
  .channel-big small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 3px; font-family: 'SUIT', sans-serif; }
  .flavor { margin: 7px 0 0; font-size: 14px; color: var(--muted); }
  .flavor strong { color: var(--ink); font-weight: 600; }

  .stat-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin: 12px 0 2px;
  }
  .stat-row .name { font-size: 15px; font-weight: 700; }
  .stars { font-size: 17px; letter-spacing: 3px; white-space: nowrap; }
  .stars .on { color: var(--epic); text-shadow: 0 0 8px rgba(255,207,71,0.45); }
  .stars .off { color: #384258; }
  .stat-comment { margin: 3px 0 10px; font-size: 13.5px; color: var(--muted); }

  .pct {
    font-family: 'DNFForgedBlade', 'SUIT', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .pct small { font-size: 15px; color: var(--muted); font-weight: 700; font-family: 'SUIT', sans-serif; }
  .pct-sub { font-size: 12.5px; color: var(--muted-2); margin: 2px 0 6px; }
  .num { font-variant-numeric: tabular-nums; }

  .mini { margin: 4px 0 0; }
  .mini .m { padding: 13px 0; border-top: 1px solid var(--line-soft); }
  .mini .m:first-child { border-top: 0; padding-top: 2px; }
  .mini .m-label { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.18em; color: var(--gold); font-weight: 700; }
  .mini .m-value { margin: 0; font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.35; }
  .mini .m-note { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .mini .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 9px; vertical-align: -2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3), 0 0 0 1px rgba(232,189,99,0.3), 0 0 8px -1px currentColor; }

  .quote {
    margin: 0;
    padding: 14px 16px;
    background: var(--gold-soft);
    border-left: 3px solid var(--gold-deep);
    border-radius: 0 8px 8px 0;
    font-size: 14px;
    color: var(--ink);
  }
  .quote .who { display: block; margin-top: 6px; font-size: 12.5px; color: var(--muted); text-align: right; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .actions .btn { flex: 1; min-width: 140px; }
  .share-nudge { text-align: center; font-size: 12.5px; color: var(--muted); margin: 15px 0 0; }
  .share-nudge b { color: var(--taecho); font-weight: 700; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(22,22,36,0.92);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid var(--gold-deep);
    color: var(--ink);
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s var(--spring);
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    margin-top: 44px;
    text-align: center;
    font-size: 12px;
    color: #58637f;
    line-height: 1.75;
  }
  footer p { margin: 4px 0; }

  /* ── 스크롤/로드 리빌 (JS 있을 때만 숨김) ── */
  html.js .rv { opacity: 0; transform: translateY(16px); }
  html.js .rv.in { opacity: 1; transform: none; transition: opacity 0.6s ease, transform 0.7s var(--spring); }
  @media (prefers-reduced-motion: reduce) {
    html.js .rv { opacity: 1 !important; transform: none !important; }
    .reveal .cardframe, .reveal .card, .reveal .card > .rvi { animation: none !important; }
  }

  [hidden] { display: none !important; }
</style>

<div class="brandbar rv" id="brandbar">
  <div class="in">
    <span class="bt">던파운세</span>
    <span class="bd" id="brandDate">ARAD DAILY ORACLE</span>
  </div>
</div>

<main>
  <header class="masthead">
    <span class="eyebrow rv">ARAD DAILY ORACLE</span>
    <h1 class="rv">오늘의 <span class="accent">던파운세</span></h1>
    <p class="rv">모험단명을 넣으면 오늘 하루 아라드의 기운을 감정해 드려요.<br>같은 모험단은 자정까지 같은 결과, 자정(KST)이 지나면 새로 바뀝니다.</p>
  </header>

  <section class="gate rv" id="gate">
    <label for="advName">모험단명 (또는 캐릭터명)</label>

  function countUp(el) {
    var to = parseInt(el.getAttribute("data-to"), 10) || 0;
    if (reduceMotion) { el.textContent = String(to); return; }
    var dur = 700, start = null, done = false;
    function finish() { if (!done) { done = true; el.textContent = String(to); } }
    function frame(ts) {
      if (done) return;
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / dur);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = String(Math.round(to * eased));
      if (t < 1) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
    setTimeout(finish, dur + 250); // 탭이 백그라운드라 rAF가 멈춰도 최종값은 보장
  }

  function runCardEntrance() {
    // 내부 섹션 순차 등장 딜레이
    if (!reduceMotion) {
      var kids = card.querySelectorAll(".rvi");
      for (var i = 0; i < kids.length; i++) kids[i].style.animationDelay = (0.05 + i * 0.06) + "s";
    }
    // 카운트업 대상
    var nums = card.querySelectorAll(".num[data-to]");
    for (var j = 0; j < nums.length; j++) countUp(nums[j]);
  }

  function render(f) {
    current = f;
    card.style.setProperty("--tier", f.tier.color);
    card.classList.toggle("taecho", f.tier.key === "taecho");
    card.innerHTML =
      '<div class="card-meta rvi"><span>' + kstDateLabel() + '</span><span>모험단 「' + esc(f.name) + '」</span></div>' +
      '<h2 class="tier-name rvi">[' + f.tier.name + '] 오늘의 아라드 운세</h2>' +
      '<p class="tier-line rvi">' + f.tier.line + '</p>' +
      '<hr class="divider" />' +
      '<div class="rvi"><p class="sec-label">오늘의 명당 채널</p>' +
      '<div class="channel-big"><span class="region">' + esc(f.region) + '</span> CH.<span class="num" data-to="' + f.channel + '">0</span></div>' +
      '<p class="flavor"><strong>' + f.chFlavor + '</strong><br>추천 시간대 ' + f.time[0] + ', ' + f.time[1] + '</p></div>' +
      '<hr class="divider" />' +
      '<div class="rvi"><p class="sec-label">오늘의 장비 운세</p>' +
      '<div class="stat-row"><span class="name">장비 증폭운</span>' + starHtml(f.amp) + '</div>' +
      '<p class="stat-comment">' + AMP[f.amp - 1] + '</p>' +
      '<div class="stat-row"><span class="name">무기 강화운</span>' + starHtml(f.reinf) + '</div>' +
      '<p class="stat-comment">' + REINF[f.reinf - 1] + '</p>' +
      '<div class="stat-row"><span class="name">봉인된 자물쇠 개봉운</span>' + starHtml(f.lock) + '</div>' +
      '<p class="stat-comment">' + LOCK[f.lock - 1] + '</p></div>' +
      '<hr class="divider" />' +
      '<div class="rvi"><p class="sec-label">오늘의 파티 운</p>' +
      '<div class="pct"><span class="num" data-to="' + f.party + '">0</span><small>%</small></div>' +
      '<p class="pct-sub">오늘의 파티원들의 합</p>' +
      '<p class="flavor">' + f.partyComment + '</p></div>' +
      '<hr class="divider" />' +
      '<div class="mini rvi">' +
      '<div class="m"><p class="m-label">행운의 NPC</p><p class="m-value">' + f.npc[0] + '</p><p class="m-note">' + f.npc[1] + '</p></div>' +
      '<div class="m"><p class="m-label">행운의 색깔</p><p class="m-value"><span class="swatch" style="background:' + f.item[2] + ';color:' + f.item[2] + '"></span>' + f.item[0] + '</p><p class="m-note">' + f.item[1] + '</p></div>' +
      '<div class="m"><p class="m-label">오늘의 추천 행동</p><p class="m-value">' + f.action[0] + '</p><p class="m-note">' + f.action[1] + '</p></div>' +
      '</div>' +
      '<hr class="divider" />' +
      '<blockquote class="quote rvi">「' + f.quote[0] + '」<span class="who">' + f.quote[1] + '</span></blockquote>';

    nudge.innerHTML = f.tier.key === "taecho"
      ? "<b>태초 운세</b>가 떴어요. 이건 스샷 찍어서 자랑하는 게 국룰입니다."
      : "태초 운세가 나올 확률은 단 3%. 내일 또 도전해 보세요.";
  }

  /* ── 항아리 개봉 파티클 버스트 ── */
  function particleBurst() {
    try {
      var rect = stage.getBoundingClientRect();
      var w = fxCanvas.width = rect.width;
      var h = fxCanvas.height = rect.height;
      var ctx = fxCanvas.getContext("2d");
      var cx = w / 2, cy = h / 2 + 10;
      var colors = ["#f6e2ad", "#e8bd63", "#fff3cf", "#3f9bff", "#ffcf47"];
      var parts = [];
      for (var i = 0; i < 60; i++) {
        var ang = Math.PI * 2 * (i / 60) + (Math.random() - 0.5) * 0.5;
        var sp = 3.2 + Math.random() * 5.5;
        parts.push({
          x: cx, y: cy,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 2.4,
          r: 1.6 + Math.random() * 3.2,
          c: colors[(Math.random() * colors.length) | 0],
          life: 1
        });
      }
      var frames = 0;
      function step() {
        frames++;
        ctx.clearRect(0, 0, w, h);
        var alive = false;
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          if (p.life <= 0) continue;
          alive = true;
          p.vy += 0.16;
          p.vx *= 0.985;
          p.x += p.vx; p.y += p.vy;
          p.life -= 0.018;
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (alive && frames < 130) requestAnimationFrame(step);
        else ctx.clearRect(0, 0, w, h);
      }
      requestAnimationFrame(step);
    } catch (e) { /* 파티클 실패해도 결과는 나온다 */ }
  }

  function showResult() {
    stageWrap.hidden = true;
    stage.classList.remove("charging", "pop", "on");
    wrap.hidden = false;
    wrap.classList.remove("reveal");
    void wrap.offsetWidth;
    wrap.classList.add("reveal");
    runCardEntrance();
    wrap.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function playAndReveal(f) {
    render(f);
    if (reduceMotion) { gate.hidden = true; showResult(); return; }
    gate.hidden = true;
    wrap.hidden = true;
    stageWrap.hidden = false;
    stage.classList.remove("pop");
    stage.classList.add("on", "charging");
    stageCap.textContent = "오늘의 보상을 개봉합니다";
    stage.scrollIntoView({ behavior: "smooth", block: "center" });

    var cd = document.getElementById("countdown");
    var n = 3;
    function tick() {
      cd.textContent = String(n);
      cd.classList.remove("tick");
      void cd.offsetWidth;
      cd.classList.add("tick");
      n--;
    }
    tick();                      // 3
    setTimeout(tick, 850);       // 2
    setTimeout(tick, 1700);      // 1
    setTimeout(function () {     // 개봉
      stage.classList.remove("charging");
      stage.classList.add("pop");
      stageCap.textContent = "";
      cd.textContent = "";
      cd.classList.remove("tick");
      particleBurst();
    }, 2550);
    setTimeout(showResult, 3250);
  }

  function copyText() {
    if (!current) return;
    var f = current;
    var lines = [
      "🔮 오늘의 던파운세 · " + kstDateLabel(),
      "🛡 모험단 「" + f.name + "」",
      "━━━━━━━━━━━━━━",
      "💎 운세 등급 [" + f.tier.name + "]",
      "🗺 오늘의 명당 " + f.region + " CH." + f.channel + " (" + f.time[0] + ")",
      "⚒ 증폭운 " + starText(f.amp) + " / 강화운 " + starText(f.reinf),
      "🔒 봉인된 자물쇠 개봉운 " + starText(f.lock),
      "🎉 파티운 " + f.party + "%",
      "🍀 행운의 NPC " + f.npc[0],
      "🎨 행운의 색깔 " + f.item[0],
      "✅ 오늘의 추천 행동 " + f.action[0],
      "━━━━━━━━━━━━━━",
      "나도 감정받기 → " + location.origin + location.pathname
    ];
    navigator.clipboard.writeText(lines.join("\n")).then(
      function () { showToast("운세를 복사했어요. 게시판에 붙여넣어 자랑해 보세요!"); },
      function () { showToast("복사에 실패했어요. 스크린샷을 이용해 주세요."); }
    );
  }

  function shareLink() {
    var url = location.origin + location.pathname + (current ? "?adv=" + encodeURIComponent(current.name) : "");
    if (navigator.share) {
      navigator.share({ title: "오늘의 던파운세", text: "오늘 아라드의 기운을 감정받아 보세요.", url: url }).catch(function () {});
    } else {
      navigator.clipboard.writeText(url).then(function () { showToast("링크를 복사했어요."); });
    }
  }

  function draw() {
    var name = input.value.trim();
    if (!name) { input.focus(); showToast("모험단명을 입력해 주세요."); return; }
    playAndReveal(makeFortune(name));
  }

  document.getElementById("drawBtn").addEventListener("click", draw);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") draw(); });
  document.getElementById("copyBtn").addEventListener("click", copyText);
  document.getElementById("shareBtn").addEventListener("click", shareLink);
  document.getElementById("againBtn").addEventListener("click", function () {
    wrap.hidden = true;
    stageWrap.hidden = true;
    gate.hidden = false;
    input.value = "";
    input.focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  /* ── 로드/스크롤 리빌 (graceful degradation) ── */
  function revealAll() {
    var els = document.querySelectorAll(".rv");
    for (var i = 0; i < els.length; i++) els[i].classList.add("in");
  }
  try {
    var brandDate = document.getElementById("brandDate");
    if (brandDate) brandDate.textContent = kstDateLabel();

    var revEls = [].slice.call(document.querySelectorAll(".rv"));
    if (reduceMotion || !("IntersectionObserver" in window)) {
      revealAll();
    } else {
      // 초기 로드 요소는 살짝 지연 스태거로 등장
      var above = revEls;
      above.forEach(function (el, i) {
        el.style.transitionDelay = (i * 0.07) + "s";
      });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
        });
      }, { threshold: 0.08, rootMargin: "0px 0px -8% 0px" });
      revEls.forEach(function (el) { io.observe(el); });
      // 스크롤 리스너 폴백 + 안전망
      setTimeout(revealAll, 1200);
    }
  } catch (e) { revealAll(); }

  var param = new URLSearchParams(location.search).get("adv");
  if (param && param.trim()) {
    input.value = param.trim();
    render(makeFortune(param.trim()));
    gate.hidden = true;
    wrap.hidden = false;
    wrap.classList.add("reveal");
    runCardEntrance();
  }
})();
</script>
