name: CGV probe (one-off analysis)
on:
  push:
    branches: [claude/cgv-ticket-monitor-tgnoas]
    paths: [cgv-monitor/probe/**, .github/workflows/cgv-probe.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash cgv-monitor/probe/jsgrep.sh
      - name: Commit probe output
        if: always()
        run: |
          git config user.name "cgv-probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f cgv-monitor/probe/out4
          git commit -m "probe output [skip ci]" || exit 0
          git pull --rebase && git push
