<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>머리하는 깍새 — 쇼츠 배경 템플릿 v2</title>
<style>
  /* ─────────────────────────────────────────────
     폰트 : 지마켓 산스 (fonts/ 폴더에 동봉)
     ───────────────────────────────────────────── */
  @font-face { font-family:'Gmarket Sans'; font-weight:300; src:url('./fonts/GmarketSansLight.ttf') format('truetype'); }
  @font-face { font-family:'Gmarket Sans'; font-weight:500; src:url('./fonts/GmarketSansMedium.ttf') format('truetype'); }
  @font-face { font-family:'Gmarket Sans'; font-weight:700; src:url('./fonts/GmarketSansBold.ttf') format('truetype'); }

  :root{
    --ink:#17181A;          /* 먹색 (외곽선·본문) */
    --cream:#F8EDD8;        /* 채널 프로필과 같은 크림 배경 */
    --cream-dot:#E4D3B2;    /* 배경 도트 텍스처 */
    --yellow:#FFD338;       /* 형광펜 하이라이트 */
    --blue:#2E7FE8;         /* 깍새(파랑새) 브랜드 컬러 */
    --orange:#F5980B;       /* 부리 오렌지 */
    --red:#FF4B3E;          /* 인기 배지 */
    --gray:#8A8272;         /* 보조 텍스트 */
    --line:#D8C6A2;         /* 절취선 */
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1920px; overflow:hidden; }
  body{
    font-family:'Gmarket Sans', sans-serif;
    color:var(--ink);
    background:var(--cream);
    position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* 배경 도트(하프톤) 텍스처 */
  body::before{
    content:''; position:absolute; inset:0;
    background-image:radial-gradient(var(--cream-dot) 2.4px, transparent 2.9px);
    background-size:36px 36px;
    opacity:.45;
    pointer-events:none;
  }

  svg{ display:block; }

  /* ── 상단 앱바 ───────────────────────────────
     유튜브 쇼츠 우상단에 실제 검색·카메라 아이콘이 뜨므로
     가짜 검색/메뉴 아이콘은 두지 않는다 (중복 방지) */
  .appbar{
    position:absolute; top:44px; left:52px; right:52px; height:92px;
    display:flex; align-items:center;
  }
  .brand-pill{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:14px;
    background:#fff; border:4px solid var(--ink); border-radius:80px;
    padding:10px 32px 10px 18px;
    box-shadow:6px 8px 0 rgba(23,24,26,.92);
    white-space:nowrap;
  }
  .brand-pill .name{ font-size:37px; font-weight:700; letter-spacing:-1px; padding-top:5px; }

  /* ── 인기 배지 ─────────────────────────────── */
  .chip-hot{
    position:absolute; top:172px; left:50%;
    transform:translateX(-50%) rotate(-1.4deg);
    display:flex; align-items:center; gap:10px;
    background:var(--red); color:#fff;
    border:3px solid var(--ink); border-radius:15px;
    padding:9px 24px 7px;
    font-size:28px; font-weight:700; letter-spacing:-.5px;
    box-shadow:4px 5px 0 rgba(23,24,26,.92);
    white-space:nowrap;
  }

  /* ── 제목 : 2줄 고정, 길면 JS가 자동 축소 ───── */
  .title{
    position:absolute; top:246px; left:40px; right:40px;
    text-align:center;
    font-size:72px; font-weight:700; line-height:1.22;
    letter-spacing:-2.5px;
  }
  .title .hl{ position:relative; display:inline-block; z-index:0; }
  .title .hl::before{
    content:''; position:absolute; z-index:-1;
    left:-10px; right:-10px; top:5%; bottom:-3%;
    background:var(--yellow);
    border-radius:12px;
    transform:skewX(-6deg) rotate(-1deg);
  }

  /* ── 메타(작성자·조회수·반응) ───────────────── */
  .meta{
    position:absolute; top:444px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:14px;
    font-size:29px; font-weight:500; color:var(--gray);
  }
  .meta .avatar{
    width:48px; height:48px; border-radius:50%;
    background:#fff; border:3px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .meta .nick{ color:var(--ink); font-weight:700; padding-top:4px; }
  .meta .item{ padding-top:4px; }
  .meta .dot{ color:var(--line); padding-top:4px; }

  /* ── 절취선(가위 디바이더) ──────────────────── */
  .cutline{
    position:absolute; top:528px; left:52px; right:52px; height:0;
    border-top:4px dashed var(--line);
  }
  .cutline .scissors{
    position:absolute; left:88px; top:-24px;
    background:var(--cream);
    padding:0 10px;
  }

  /* ── 콘텐츠 프레임 : 정사각(880×880) ──────────
     밈 이미지·실사 클립을 이 안에 꽉 채워 올린다 */
  .frame{
    position:absolute; top:566px; left:100px; width:880px; height:880px;
    background:#fff;
    border:5px solid var(--ink); border-radius:36px;
    box-shadow:10px 12px 0 rgba(23,24,26,.92);
    overflow:hidden;
  }
  .frame .ph{
    position:absolute; inset:24px;
    border:4px dashed #E3D8C2; border-radius:20px;
    display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:24px;
    color:#B9AD93; font-size:31px; font-weight:500;
  }
  body.preview .frame .ph{ display:flex; }

  /* ── 자막 영역 : y1486~1646 ──────────────────
     클린 렌더에서는 완전히 비워 둔다 (편집기에서 자막 삽입).
     preview 모드에서만 가이드와 권장 스타일 예시가 보인다 */
  .subzone{
    position:absolute; top:1486px; left:90px; right:90px; height:160px;
    display:none;
    align-items:center; justify-content:center;
    border:4px dashed #E3D8C2; border-radius:20px;
  }
  body.preview .subzone{ display:flex; }
  .subzone .sample{
    text-align:center;
    font-size:46px; font-weight:700; letter-spacing:-1.5px; line-height:1.45;
  }
  .subzone .sample .hl{
    background:var(--yellow); border-radius:8px; padding:0 8px;
  }

  /* 하단 y1650 이하는 유튜브 쇼츠 UI(채널명·설명·음악바)가
     덮는 구역이므로 아무것도 배치하지 않는다 */
</style>
</head>
<body>

  <!-- 상단 앱바 -->
  <div class="appbar">
    <!-- 뒤로가기 -->
    <svg width="42" height="42" viewBox="0 0 44 44" fill="none" stroke="#17181A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M28 8 L14 22 L28 36"/>
    </svg>

    <div class="brand-pill">
      <!-- 깍새(파랑새+가위) 로고 -->
      <svg width="56" height="56" viewBox="0 0 100 100">
        <!-- 가위 -->
        <g transform="translate(64,6) rotate(30)" stroke="#17181A" stroke-width="3" fill="#C8CDD4">
          <line x1="8" y1="26" x2="26" y2="2" stroke-width="4"/>
          <line x1="24" y1="26" x2="6" y2="2" stroke-width="4"/>
          <circle cx="7" cy="30" r="5" fill="#9AA1AB"/>
          <circle cx="25" cy="30" r="5" fill="#9AA1AB"/>
        </g>
        <!-- 다리 -->
        <g stroke="#E58A1F" stroke-width="4" stroke-linecap="round">
          <line x1="42" y1="82" x2="42" y2="94"/><line x1="37" y1="94" x2="47" y2="94"/>
          <line x1="60" y1="82" x2="60" y2="94"/><line x1="55" y1="94" x2="65" y2="94"/>
        </g>
        <!-- 몸통 -->
        <ellipse cx="51" cy="52" rx="33" ry="31" fill="#2E7FE8" stroke="#17181A" stroke-width="3.5"/>
        <!-- 날개 -->
        <path d="M22 56 Q14 62 20 70 Q28 68 30 60 Z" fill="#2467C4" stroke="#17181A" stroke-width="3"/>
        <!-- 눈 -->
        <circle cx="40" cy="46" r="12.5" fill="#fff" stroke="#17181A" stroke-width="3"/>
        <circle cx="63" cy="46" r="12.5" fill="#fff" stroke="#17181A" stroke-width="3"/>
        <circle cx="41.5" cy="47" r="4.6" fill="#17181A"/>
        <circle cx="61.5" cy="47" r="4.6" fill="#17181A"/>
        <!-- 부리 -->
        <path d="M46.5 59 L56.5 59 L51.5 67 Z" fill="#F5980B" stroke="#17181A" stroke-width="2.5"/>
      </svg>
      <span class="name">머리하는 깍새</span>
    </div>
  </div>

  <!-- 인기 배지 -->
  <div class="chip-hot">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff">
      <path d="M12 2c1 3-1 4.5-2 6C8.5 10.2 8 12 9 14a5.5 5.5 0 0 0 3 3c-.4-1.6.2-2.8 1.3-3.8 1.4-1.3 2.4-2.7 2.2-4.7 2.1 1.5 3.5 4 3.5 6.5A7 7 0 0 1 5 15c0-3.5 2-5.2 3.5-7C9.8 6.4 11.6 4.5 12 2z"/>
    </svg>
    실시간 인기 게시글
  </div>

  <!-- 제목 : 영상마다 이 부분만 교체 (2줄 권장, 길면 자동 축소) -->
  <h1 class="title" id="title">
    쓰리스타킬러 셰프가<br>
    식단 대신 <span class="hl">헬스</span>에 진심인 이유
  </h1>

  <!-- 메타 정보 -->
  <div class="meta">
    <span class="avatar">
      <svg width="37" height="37" viewBox="0 0 100 100">
        <ellipse cx="51" cy="56" rx="35" ry="33" fill="#2E7FE8" stroke="#17181A" stroke-width="4"/>
        <circle cx="40" cy="50" r="13" fill="#fff" stroke="#17181A" stroke-width="3.5"/>
        <circle cx="63" cy="50" r="13" fill="#fff" stroke="#17181A" stroke-width="3.5"/>
        <circle cx="41.5" cy="51" r="5" fill="#17181A"/>
        <circle cx="61.5" cy="51" r="5" fill="#17181A"/>
        <path d="M46.5 63 L56.5 63 L51.5 71 Z" fill="#F5980B" stroke="#17181A" stroke-width="2.5"/>
      </svg>
    </span>
    <span class="nick">깍새</span>
    <span class="dot">·</span>
    <span class="item">조회 24.8만</span>
    <span class="dot">·</span>
    <span class="item">추천 3,482</span>
    <span class="dot">·</span>
    <span class="item">댓글 1,204</span>
  </div>

  <!-- 절취선 -->
  <div class="cutline">
    <span class="scissors">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#17181A" stroke-width="1.8" transform="rotate(90)">
        <circle cx="6" cy="6" r="3"/>
        <circle cx="6" cy="18" r="3"/>
        <line x1="8.5" y1="7.8" x2="20" y2="16"/>
        <line x1="8.5" y1="16.2" x2="20" y2="8"/>
      </svg>
    </span>
  </div>

  <!-- 콘텐츠 프레임 : 이 정사각 영역에 밈/실사 컷을 올리면 됨 -->
  <div class="frame">
    <div class="ph">
      <svg width="150" height="150" viewBox="0 0 100 100" opacity="0.5">
        <ellipse cx="51" cy="56" rx="35" ry="33" fill="#2E7FE8" stroke="#17181A" stroke-width="3"/>
        <circle cx="40" cy="50" r="13" fill="#fff" stroke="#17181A" stroke-width="3"/>
        <circle cx="63" cy="50" r="13" fill="#fff" stroke="#17181A" stroke-width="3"/>
        <circle cx="41.5" cy="51" r="5" fill="#17181A"/>
        <circle cx="61.5" cy="51" r="5" fill="#17181A"/>
        <path d="M46.5 63 L56.5 63 L51.5 71 Z" fill="#F5980B" stroke="#17181A" stroke-width="2.5"/>
      </svg>
      <span>콘텐츠 영역 · 880 × 880</span>
    </div>
  </div>

  <!-- 자막 가이드 (preview 모드에서만 표시) -->
  <div class="subzone">
    <div class="sample">근데 요즘 <span class="hl">승모근</span>이랑<br>팔꿈치를 다쳐서</div>
  </div>

<script>
  // file://template.html?mode=preview 로 열면 콘텐츠·자막 가이드가 표시됩니다.
  if (new URLSearchParams(location.search).get('mode') === 'preview') {
    document.body.classList.add('preview');
  }

  // 제목 자동 축소: 좌우 여백을 넘치면 글자 크기를 줄인다 (최소 54px)
  (function(){
    const t = document.getElementById('title');
    let size = 72;
    while (size > 54 && t.scrollWidth > t.clientWidth) {
      size -= 2;
      t.style.fontSize = size + 'px';
    }
  })();
</script>
</body>
</html>
